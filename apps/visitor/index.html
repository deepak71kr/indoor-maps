<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Inner Map</title>
    <script>
      // Start downloading the map in parallel with the app's JavaScript (saves a round trip
      // on 2G). Site rules must match main.ts. Relative URL: works under any base path.
      (function () {
        var site = (new URLSearchParams(location.search).get('site') || 'demo-hospital').replace(
          /[^a-z0-9-]/g,
          '',
        );
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'fetch';
        link.crossOrigin = 'anonymous';
        link.href = 'maps/' + site + '.json';
        document.head.appendChild(link);
      })();
    </script>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
